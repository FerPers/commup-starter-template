# Cloudflare Worker — CommUP Push Dispatcher
# Stage 14.5

name = "commup-push-dispatcher"
main = "push-dispatcher.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build:worker"

# ── KV Namespaces ─────────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "PUSH_SUBS_KV"
id = "REPLACE_WITH_ACTUAL_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_ID"

# ── Cron Triggers ─────────────────────────────────────────────────────────
[triggers]
crons = ["0 3 * * *"]   # 3 AM UTC — cleanup de subs expiradas

# ── Routes ────────────────────────────────────────────────────────────────
[[routes]]
pattern = "api.commup.io/api/push/*"
zone_name = "commup.io"

# ── Secrets (configurar con: wrangler secret put <NAME>) ─────────────────
# VAPID_PRIVATE_KEY
# VAPID_PUBLIC_KEY
# VAPID_SUBJECT
# SUPABASE_URL
# SUPABASE_SERVICE_KEY

# ── Vars (no secretas) ────────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
MAX_BATCH_SIZE = "50"

# ── Dev ───────────────────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"
